<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rain</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }

        /* 悄悄進行網頁切換的頂部進度條 */
        #loadingBar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background-color: rgba(56, 189, 248, 0.7);
            /* 淡藍色光暈，符合雨天氛圍 */
            width: 0%;
            transition: width 0.1s linear;
            z-index: 50;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>

<body>
    <!-- 網頁切換進度條 -->
    <div id="loadingBar"></div>

    <canvas id="rippleCanvas"></canvas>
    <div id="info-overlay">仰望透明雨傘，等待雨滴與留言落下...</div>

    <script>
        // 雨傘 tracking
        let video;

        let points = [];

        let umbrellaX = 0;
        let umbrellaY = 0;

        let smoothX = 0;
        let smoothY = 0;

        const SHEET_API = "https://opensheet.elk.sh/1A5k99fbXf9kFppiZBPSUBy6l8TGGDudqwtB9DA5Suws/data";
        const canvas = document.getElementById('rippleCanvas');
        const ctx = canvas.getContext('2d');
        const loadingBar = document.getElementById('loadingBar');

        let width, height;
        let centerX, centerY; // 畫面的透視消失點 (天空最高處)

        let fallingDrops = []; // 正在落下的雨滴 (空中的)
        let dropEvents = [];   // 已經撞擊傘面的漣漪與文字
        let splashes = [];     // 撞擊後濺起並沿著傘面滑落的水花

        let frameCount = 0;
        let state = 'START';
        let nextRainFrame = 0;
        let messageIndex = 0;
        let rainIntensity = 0; // 用來控制背景雨勢逐漸變大的變數

        // --- Wiimote 網頁跳轉設定 ---
        const pages = {
            1: "page1.html",  // 當前頁面（如果轉到這裡，進度條不會跑，保持原樣）
            2: "page2.html",  // 第二階段網頁
            3: "page3.html"   // 第三階段網頁
        };

        let currentTargetZone = 1; // 預設就在第一頁的區域
        let zoneStartTime = 0;
        const HOLD_DURATION = 1500; // 在新區間停停留 1.5 秒即觸發跳轉

        let messagePool = [];
        async function loadMessagesFromSheet() {
            try {
                const res = await fetch(SHEET_API);
                const data = await res.json();

                // 抓 message 欄位
                messagePool = data
                    .map(item => item.message)
                    .filter(msg => msg && msg.trim() !== "");

                console.log("載入留言：", messagePool);

            } catch (err) {
                console.error("讀取 Google Sheet 失敗", err);
            }
        }
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // =====================================================
        // 啟動攝影機
        // =====================================================

        navigator.mediaDevices
            .enumerateDevices()
            .then(gotDevices);

        function gotDevices(deviceInfos) {

            let videoDevices = [];

            for (let i = 0; i < deviceInfos.length; i++) {

                let device = deviceInfos[i];

                if (device.kind === 'videoinput') {

                    videoDevices.push(device);

                    console.log(
                        videoDevices.length - 1,
                        device.label
                    );
                }
            }

            // DroidCam 通常是 1
            let preferredCamera =
                videoDevices[1] ||
                videoDevices[0];

            video = createCapture({
                video: {
                    deviceId:
                        preferredCamera.deviceId
                }
            });

            video.size(640, 480);

            // 完全隱藏鏡頭
            video.hide();
        }

        // ----------------------------------------------------
        // 1. 迎面落下的雨滴 (3D透視感)
        // ----------------------------------------------------
        class FallingDrop {
            constructor(targetX, targetY, text, isBig = false, isBg = false) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.text = text;
                this.isBig = isBig;
                this.isBg = isBg; // 是否為背景常態雨滴

                // z 軸代表距離，0 = 天空最高處 (消失點)，1 = 撞擊雨傘表面
                this.z = 0;
                // 下落速度 (大雨滴砸得稍微快一點，背景雨滴偏快)
                this.speed = isBig ? 0.04 : (isBg ? (Math.random() * 0.03 + 0.03) : (Math.random() * 0.015 + 0.025));
            }

            update() {
                this.z += this.speed;
                return this.z >= 1; // 回傳 true 代表撞擊到傘面了
            }

            draw(ctx) {
                // 利用透視公式計算當前畫面上的 X, Y 座標
                const currentX = centerX + (this.targetX - centerX) * this.z;
                const currentY = centerY + (this.targetY - centerY) * this.z;

                // 計算雨絲的尾巴 (視覺暫留)，尾巴位於較遠的 z 軸位置
                const tailZ = Math.max(0, this.z - 0.25);
                const tailX = centerX + (this.targetX - centerX) * tailZ;
                const tailY = centerY + (this.targetY - centerY) * tailZ;

                // 畫雨絲的拖影
                ctx.beginPath();
                ctx.moveTo(currentX, currentY);
                ctx.lineTo(tailX, tailY);

                let grad = ctx.createLinearGradient(currentX, currentY, tailX, tailY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${this.z})`); // 靠近傘面的頭部較亮
                grad.addColorStop(1, `rgba(255, 255, 255, 0)`);         // 尾巴透明

                ctx.strokeStyle = grad;
                // 背景雨滴的線條比較細
                ctx.lineWidth = this.isBig ? 4 * this.z : (this.isBg ? 1.5 * this.z : 2 * this.z);
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        // ----------------------------------------------------
        // 2. 水花粒子 (沿著弧形傘面向外滑落)
        // ----------------------------------------------------
        class Splash {
            constructor(x, y, isBig, isBg = false) {
                this.x = x;
                this.y = y;
                // 撞擊瞬間的初始爆發力 (向四周散開)
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (isBig ? 5 : (isBg ? 1.5 : 2.5));
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.life = 1.0;
                this.decay = isBg ? Math.random() * 0.05 + 0.05 : Math.random() * 0.02 + 0.015;
                this.size = isBg ? Math.random() * 1 + 0.5 : Math.random() * 2 + 1;
            }
            update() {
                // 模擬傘面的「穹頂重力」：水珠會順著傘的弧度，向外(遠離中心)加速滑落
                let dx = this.x - centerX;
                let dy = this.y - centerY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    this.vx += (dx / dist) * 0.15;
                    this.vy += (dy / dist) * 0.15;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.92;
                this.vy *= 0.92;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.fillStyle = `rgba(200, 230, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ----------------------------------------------------
        // 3. 傘面上的漣漪與留言
        // ----------------------------------------------------
        class DropEvent {
            constructor(x, y, text, isBig = false, isBg = false) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.isBig = isBig;
                this.isBg = isBg;

                this.life = 0;
                // 背景雨滴產生的漣漪生命週期極短
                this.maxLife = isBig ? 300 : (isBg ? 25 : 700);

                this.rippleRadius = 0;
                this.rippleSpeed = isBig ? 3.5 : (isBg ? 1.5 : 1.2);
                this.maxRippleRadius = isBig ? Math.max(width, height) * 0.8 : (isBg ? (Math.random() * 20 + 10) : (Math.random() * 100 + 150));

                this.textScale = 0.4;
                this.textOpacity = 0;
                this.textYOffset = 0;

                // 產生撞擊水花 (背景雨滴水花數量極少)
                const splashCount = isBig ? 25 : (isBg ? Math.floor(Math.random() * 2) : Math.floor(Math.random() * 5) + 4);
                for (let i = 0; i < splashCount; i++) {
                    splashes.push(new Splash(x, y, isBig, isBg));
                }
            }

            update() {
                this.life++;
                this.rippleRadius += this.rippleSpeed;

                if (!this.isBig && !this.isBg && this.text) {
                    if (this.life < 150) {
                        this.textOpacity = (this.life / 150) * 0.9;
                        this.textScale = 0.4 + (this.life / 150) * 0.6;
                    }
                    else if (this.life > this.maxLife - 200) {
                        let fadeLife = this.life - (this.maxLife - 200);
                        this.textOpacity = 0.9 - (fadeLife / 200) * 0.9;
                        this.textScale += 0.0005;
                        this.textYOffset -= 0.1;
                    }
                    else {
                        this.textScale += 0.0005;
                    }
                }
            }

            draw(ctx) {
                let rOpacity = 1 - (this.rippleRadius / this.maxRippleRadius);
                if (rOpacity > 0) {
                    ctx.beginPath();
                    // 加入 Math.max 防止負數報錯
                    ctx.arc(this.x, this.y, Math.max(0, this.rippleRadius), 0, Math.PI * 2);

                    // 背景小雨滴的漣漪非常透明
                    let baseOpacity = this.isBig ? 0.7 : (this.isBg ? 0.15 : 0.4);
                    ctx.strokeStyle = `rgba(160, 200, 255, ${rOpacity * baseOpacity})`;
                    ctx.lineWidth = this.isBig ? 2.5 : (this.isBg ? 1 : 1.5);
                    ctx.stroke();

                    // 留言雨滴或大雨滴才有雙層漣漪效果
                    if (!this.isBg && this.rippleRadius > 20) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, Math.max(0, this.rippleRadius - 20), 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(160, 200, 255, ${rOpacity * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }

                    // 微微水波反光
                    if (!this.isBg && this.life < 20) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, Math.max(0, this.rippleRadius * 0.5), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${(20 - this.life) * 0.01})`;
                        ctx.fill();
                    }
                }

                if (!this.isBg && this.text && this.textOpacity > 0) {
                    ctx.save();
                    let floatY = Math.sin(this.life * 0.03) * 4;

                    ctx.translate(this.x, this.y + this.textYOffset + floatY);
                    ctx.scale(this.textScale, this.textScale);

                    ctx.font = '300 28px "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = `rgba(255, 255, 255, ${this.textOpacity * 0.6})`;
                    ctx.shadowBlur = 12;

                    ctx.fillStyle = `rgba(240, 248, 255, ${this.textOpacity})`;
                    ctx.fillText(this.text, 0, 0);

                    ctx.restore();
                }
            }
        }

        // ----------------------------------------------------
        // 主動畫與手把偵測迴圈
        // ----------------------------------------------------
        function animate() {

            updateTracking();

            // 背景：中心微亮的深淵漸層，製造穹頂空間感
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height));
            gradient.addColorStop(0, '#162436');
            gradient.addColorStop(1, '#020617');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            frameCount++;

            // --- Wiimote 搖桿偵測部分 ---
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                const gp = gamepads[0];
                let rawValue = gp.axes[0]; // 讀取搖桿 X 軸
                let angle = (rawValue + 1) * 180; // 轉為 0 ~ 360 度

                // 判斷當前角度落在哪個網頁區間
                let detectedZone = 1;
                if (angle >= 0 && angle <= 120) {
                    detectedZone = 1;
                } else if (angle > 120 && angle <= 240) {
                    detectedZone = 2;
                } else {
                    detectedZone = 3;
                }

                const currentTime = performance.now();

                // 核心防抖跳轉邏輯
                if (detectedZone !== currentTargetZone) {
                    // 切換到不同區間，重新計時
                    currentTargetZone = detectedZone;
                    zoneStartTime = currentTime;
                    loadingBar.style.width = '0%';
                } else if (currentTargetZone !== 1) {
                    // 如果停留在 2 或 3 號區域（非本頁），開始跑進度條並倒數跳轉
                    let elapsedTime = currentTime - zoneStartTime;
                    let progress = Math.min((elapsedTime / HOLD_DURATION) * 100, 100);
                    loadingBar.style.width = `${progress}%`;

                    if (elapsedTime >= HOLD_DURATION) {
                        window.location.href = pages[currentTargetZone];
                        return; // 中斷當前動畫，準備跳轉網頁
                    }
                } else {
                    // 如果回到了本頁區域 (Zone 1)，進度條歸零
                    loadingBar.style.width = '0%';
                }
            }

            // --- 原本的雨滴動畫邏輯 ---
            if (state === 'START') {
                if (frameCount === 30) {
                    fallingDrops.push(new FallingDrop(centerX, centerY, null, true, false));
                }
            }
            else if (state === 'RAINING') {
                if (rainIntensity < 0.4) rainIntensity += 0.002;
                if (Math.random() < rainIntensity) {
                    const bgX = Math.random() * width;
                    const bgY = Math.random() * height;
                    fallingDrops.push(new FallingDrop(bgX, bgY, null, false, true));
                }

                if (frameCount >= nextRainFrame) {
                    const marginX = width * 0.15;
                    const marginY = height * 0.15;
                    const dropX = marginX + Math.random() * (width - marginX * 2);
                    const dropY = marginY + Math.random() * (height - marginY * 2);

                    const text = messagePool[messageIndex];
                    messageIndex = (messageIndex + 1) % messagePool.length;

                    fallingDrops.push(new FallingDrop(dropX, dropY, text, false, false));
                    nextRainFrame = frameCount + Math.floor(Math.random() * 160) + 160;
                }
            }

            for (let i = fallingDrops.length - 1; i >= 0; i--) {
                const drop = fallingDrops[i];
                const hasHit = drop.update();
                drop.draw(ctx);

                if (hasHit) {
                    dropEvents.push(new DropEvent(drop.targetX, drop.targetY, drop.text, drop.isBig, drop.isBg));
                    fallingDrops.splice(i, 1);

                    if (drop.isBig && state === 'START') {
                        state = 'RAINING';
                        nextRainFrame = frameCount + 120;
                    }
                }
            }

            for (let i = dropEvents.length - 1; i >= 0; i--) {
                const drop = dropEvents[i];
                drop.update();
                drop.draw(ctx);
                if (drop.life >= drop.maxLife) {
                    dropEvents.splice(i, 1);
                }
            }

            for (let i = splashes.length - 1; i >= 0; i--) {
                const splash = splashes[i];
                splash.update();
                splash.draw(ctx);
                if (splash.life <= 0) {
                    splashes.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = async () => {
            await loadMessagesFromSheet();

            if (width === 0 || height === 0) {
                requestAnimationFrame(window.onload);
                return;
            }

            animate();
        };

        canvas.addEventListener('click', (e) => {
            if (state === 'RAINING') {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const text = messagePool[messageIndex];
                messageIndex = (messageIndex + 1) % messagePool.length;

                fallingDrops.push(new FallingDrop(x, y, text, false, false));
            }
        });

        // =====================================================
        // 綠點追蹤
        // =====================================================

        function updateTracking() {

            if (!video) return;

            video.loadPixels();

            points = [];

            // 找綠點

            for (let y = 0; y < video.height; y += 4) {

                for (let x = 0; x < video.width; x += 4) {

                    let index =
                        (x + y * video.width) * 4;

                    let r = video.pixels[index + 0];
                    let g = video.pixels[index + 1];
                    let b = video.pixels[index + 2];

                    if (

                        g > 90 &&
                        g > r + 20 &&
                        g > b + 20

                    ) {

                        points.push({
                            x: x,
                            y: y
                        });
                    }
                }
            }

            // 算中心

            if (points.length > 0) {

                let sumX = 0;
                let sumY = 0;

                for (let p of points) {

                    sumX += p.x;
                    sumY += p.y;
                }

                let targetX =
                    sumX / points.length;

                let targetY =
                    sumY / points.length;

                smoothX = lerp(
                    smoothX,
                    targetX,
                    0.08
                );

                smoothY = lerp(
                    smoothY,
                    targetY,
                    0.08
                );

                umbrellaX = map(
                    smoothX,
                    0,
                    video.width,
                    0,
                    width
                );

                umbrellaY = map(
                    smoothY,
                    0,
                    video.height,
                    0,
                    height
                );

                if (
    socket.readyState === WebSocket.OPEN
) {

    socket.send(
        JSON.stringify({

            x: umbrellaX,
            y: umbrellaY

        })
    );
}

                // debug（可刪）

                console.log(
                    umbrellaX,
                    umbrellaY
                );
            }
        }

    </script>
</body>

</html>
