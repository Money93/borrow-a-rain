<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

  <script src="sketch.js"></script>

  <style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  iframe {

    position: absolute;
    left: 0;
    top: 0;

    width: 1200px;
    height: 1200px;

    border: none;

    pointer-events: none;

    transform: translate(-50%, -50%) scaleX(-1);

    

    /* 三角形扇形 */
  clip-path: polygon(
    50% 0%,
    100% 100%,
    0% 100%
  );

  -webkit-clip-path: polygon(
    50% 0%,
    100% 100%,
    0% 100%
  );
  }
</style>

</head>

<body>

  <iframe id="projectFrame" src="scene1.html">
  </iframe>

</body>

</html>
