<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

  <script src="sketch.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    iframe {

      position: absolute;

      left: 50%;
      top: 54%;

      width: 1400px;
      height: 1200px;

      border: none;

      pointer-events: none;

      overflow: hidden;

      transform: translate(-50%, -50%) scaleX(-1);

      transition: opacity 0.4s ease;
      opacity: 1;

      clip-path: polygon(50% 3%,
          99% 50%,
          75% 92%,
          25% 92%,
          1% 50%);

      -webkit-clip-path: polygon(50% 3%,
          99% 50%,
          75% 92%,
          25% 92%,
          1% 50%);
    }
  </style>

</head>

<body>

  <iframe id="projectFrame" src="scene1.html">
  </iframe>

</body>

</html>
